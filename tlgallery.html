```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TreeLand Gallery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f3f3;
}

header{
    background:#2563eb;
    color:white;
    text-align:center;
    padding:20px;
}

nav{
    background:#1e40af;
    display:flex;
    justify-content:center;
    gap:20px;
    padding:12px;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.page-title{
    text-align:center;
    padding:20px;
}

.controls{
    text-align:center;
    margin-bottom:20px;
}

.controls button{
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:#16a34a;
    color:white;
    cursor:pointer;
}

.cards-container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.card{
    width:260px;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

.card-image-container{
    position:relative;
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.badges{
    position:absolute;
    top:10px;
    left:10px;
    display:flex;
    gap:5px;
}

.badge{
    background:#3b82f6;
    color:white;
    padding:4px 8px;
    border-radius:20px;
    font-size:12px;
}

.green{
    background:#22c55e;
}

.card-body{
    padding:15px;
}

.location{
    color:gray;
    margin:8px 0;
}

.description{
    margin:10px 0;
    color:#444;
}

.progress-bar{
    height:8px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    background:#22c55e;
}

.progress-text{
    text-align:right;
    font-weight:bold;
    margin-top:5px;
}

.hidden{
    display:none;
}

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:20px;
}

footer a{
    color:#4ade80;
    text-decoration:none;
}

@media(max-width:600px){
    .card{
        width:95%;
    }
}
</style>
</head>
<body>

<header>
    <h1>🌱 TreeLand Gallery</h1>
</header>

<nav>
    <a href="accueil.html">Accueil</a>
    <a href="tlmarché.html">SuperMarché</a>
    <a href="tlgallery.html">Gallery</a>
</nav>

<section class="page-title">
    <h2>Projets Communautaires</h2>
    <p>Découvrez les initiatives soutenues par TreeLand.</p>
</section>

<div class="controls">
    <button id="toggleProjects">
        Afficher / Masquer les projets
    </button>
</div>

<section class="cards-container" id="cardsContainer">
</section>

<footer>
    <p>&copy; 2026 TreeLand</p>
    <a href="references.html">References</a>
</footer>

<script>

const projets = [
{
    titre:"Youth Skills Workshop",
    lieu:"Central Community Center",
    description:"Programme après l'école enseignant les compétences numériques.",
    progression:42,
    image:"img222.png",
    categorie:"Education"
},
{
    titre:"Digital Camp",
    lieu:"West Side Center",
    description:"Camp d'été consacré au design et au codage.",
    progression:65,
    image:"img222.png",
    categorie:"Workshop"
},
{
    titre:"Community Garden",
    lieu:"Riverside Neighborhood",
    description:"Création d'un jardin communautaire pour les familles locales.",
    progression:68,
    image:"img222.png",
    categorie:"Environment"
},
{
    titre:"Tree Planting Day",
    lieu:"Grand-Bassam",
    description:"Reboisement et sensibilisation environnementale.",
    progression:80,
    image:"img222.png",
    categorie:"Environment"
}
];

const container =
document.getElementById("cardsContainer");

function afficherProjets(){

    container.innerHTML = "";

    projets.forEach(projet => {

        container.innerHTML += `
        <div class="card">

            <div class="card-image-container">

                <img
                src="${projet.image}"
                alt="${projet.titre}"
                loading="lazy">

                <div class="badges">
                    <div class="badge">
                        ${projet.categorie}
                    </div>

                    <div class="badge green">
                        Project
                    </div>
                </div>

            </div>

            <div class="card-body">

                <h3>${projet.titre}</h3>

                <div class="location">
                    📍 ${projet.lieu}
                </div>

                <div class="description">
                    ${projet.description}
                </div>

                <div>Progression :</div>

                <div class="progress-bar">
                    <div
                    class="progress-fill"
                    style="width:${projet.progression}%">
                    </div>
                </div>

                <div class="progress-text">
                    ${projet.progression}%
                </div>

            </div>

        </div>
        `;
    });
}

document
.getElementById("toggleProjects")
.addEventListener("click", () => {

    container.classList.toggle("hidden");

});

afficherProjets();

</script>
<footer>
  <p>&copy; 2026 TreeLand</p>
  <a href="references.html">References</a>
</footer>

</body>
</html>
